apiVersion: batch/v1
kind: Job
metadata:
  name: hyperlight-nested-demo
  namespace: hyperlight-system
  labels:
    app.kubernetes.io/name: hyperlight-nested-demo
    app.kubernetes.io/part-of: hyperlight
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperlight-nested-demo
        app.kubernetes.io/part-of: hyperlight
    spec:
      automountServiceAccountToken: false
      runtimeClassName: hyperlight-delegated
      securityContext:
        supplementalGroupsPolicy: Strict
      nodeSelector:
        hyperlight.dev/nested-demo: "true"
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: demo
          image: hyperlight-nested-demo:bb153b2
          imagePullPolicy: Never
          env:
            - name: DEMO_PACE_SECONDS
              value: "${DEMO_PACE_SECONDS}"
            - name: RUST_LOG
              value: "warn"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: Localhost
              localhostProfile: hyperlight-launcher.json
          resources:
            requests:
              hyperlight.dev/hypervisor: "1"
              cpu: "10m"
              memory: "64Mi"
            limits:
              hyperlight.dev/hypervisor: "1"
              cpu: "1"
              memory: "512Mi"
